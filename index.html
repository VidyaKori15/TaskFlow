<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Plan. Organize. Accomplish.</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-layer-group text-primary me-2"></i>
                    <span>TaskFlow</span>
                </div>
                <button class="btn d-md-none" id="closeSidebar"><i class="fas fa-times"></i></button>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <a href="#" class="nav-link active" data-view="dashboard">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                    <a href="#" class="nav-link" data-view="all">
                        <i class="fas fa-tasks"></i> All Tasks
                    </a>
                    <a href="#" class="nav-link" data-view="today">
                        <i class="fas fa-calendar-day"></i> Today
                    </a>
                    <a href="#" class="nav-link" data-view="upcoming">
                        <i class="fas fa-calendar-alt"></i> Upcoming
                    </a>
                    <a href="#" class="nav-link" data-view="completed">
                        <i class="fas fa-check-circle"></i> Completed
                    </a>
                </div>

                <div class="nav-section">
                    <h6 class="section-title">MY LISTS</h6>
                    <div id="custom-lists">
                        <!-- Custom lists injected here -->
                    </div>
                    <a href="#" class="nav-link add-list-btn" data-bs-toggle="modal" data-bs-target="#newListModal">
                        <i class="fas fa-plus"></i> New List
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-theme-toggle" id="themeToggle">
                    <i class="fas fa-moon me-2"></i> <span>Dark Mode</span>
                </button>
                <a href="#" class="nav-link mt-2"><i class="fas fa-cog"></i> Settings</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="header">
                <div class="header-left">
                    <button class="btn d-md-none me-2" id="openSidebar"><i class="fas fa-bars"></i></button>
                    <h4 id="pageTitle">Dashboard</h4>
                </div>
                
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="globalSearch" placeholder="Search tasks...">
                    </div>
                    <button class="icon-btn"><i class="fas fa-bell"></i></button>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=User&background=0D6EFD&color=fff" alt="User">
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div id="viewContainer" class="content-body">
                <!-- Content dynamically injected by script.js -->
            </div>
        </main>
    </div>

    <!-- Modals -->
    <!-- Add/Edit Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalLabel">Create New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="taskForm">
                        <input type="hidden" id="taskId">
                        <div class="mb-3">
                            <label class="form-label">Task Title</label>
                            <input type="text" class="form-control" id="taskTitle" required placeholder="e.g., Complete Java Practice">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="taskDesc" rows="2" placeholder="Briefly describe the task..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" id="taskDate" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Due Time</label>
                                <input type="time" class="form-control" id="taskTime" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Priority</label>
                                <select class="form-select" id="taskPriority">
                                    <option value="Low">Low</option>
                                    <option value="Medium" selected>Medium</option>
                                    <option value="High">High</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="taskCategory">
                                    <option value="Work">Work</option>
                                    <option value="Study">Study</option>
                                    <option value="Personal">Personal</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="taskStatus">
                                <option value="todo">To Do</option>
                                <option value="inprogress">In Progress</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="taskForm" class="btn btn-primary" id="saveTaskBtn">Create Task</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center p-4">
                    <i class="fas fa-exclamation-triangle text-danger mb-3" style="font-size: 2rem;"></i>
                    <h5>Delete this task?</h5>
                    <p class="text-muted small">This action cannot be undone.</p>
                    <div class="d-flex justify-content-center gap-2 mt-3">
                        <button class="btn btn-light px-4" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-danger px-4" id="confirmDeleteBtn">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New List Modal -->
    <div class="modal fade" id="newListModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title">Create New List</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control" id="newListInput" placeholder="List name (e.g., Projects)">
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button class="btn btn-primary w-100" id="saveListBtn">Create List</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-white bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    Task created successfully
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
